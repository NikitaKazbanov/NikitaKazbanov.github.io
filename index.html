<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Сервисы проверки файлов</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;

            background: linear-gradient(
                135deg,
                #7b2cff 0%,
                #754cff 25%,
                #4f7cff 55%,
                #38bfff 100%
            );

            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 600px;

            padding: 40px 34px;

            text-align: center;

            background: rgba(255, 255, 255, 0.14);

            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 24px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 34px;
            line-height: 1.15;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tool {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            color: #ffffff;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 15px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .tool:hover {
            transform: translateY(-3px);

            background: rgba(255, 255, 255, 0.22);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .tool:active {
            transform: scale(0.98);
        }

        .tool-text {
            min-width: 0;
            text-align: left;
        }

        .tool-name {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .tool-description {
            margin-top: 5px;

            font-size: 13px;
            line-height: 1.35;

            color: rgba(255, 255, 255, 0.75);
        }

        .arrow {
            flex-shrink: 0;

            margin-left: 15px;

            font-size: 25px;
            line-height: 1;

            color: rgba(255, 255, 255, 0.9);
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
                align-items: center;
            }

            .container {
                max-width: 100%;
                padding: 30px 18px;
                border-radius: 20px;
            }

            h1 {
                font-size: 27px;
                margin-bottom: 24px;
            }

            .links {
                gap: 12px;
            }

            .tool {
                padding: 16px;
                border-radius: 14px;
            }

            .tool-name {
                font-size: 16px;
            }

            .tool-description {
                font-size: 12px;
            }

            .arrow {
                font-size: 22px;
                margin-left: 10px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 25px 14px;
            }

            h1 {
                font-size: 24px;
            }

            .tool {
                padding: 14px;
            }

            .tool-name {
                font-size: 15px;
            }

            .tool-description {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Сервисы проверки файлов</h1>

        <div class="links">

            <a
                class="tool"
                href="https://any.run/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="tool-text">
                    <div class="tool-name">ANY.RUN</div>

                    <div class="tool-description">
                        Интерактивный анализ файлов в облачной песочнице
                    </div>
                </div>

                <div class="arrow">→</div>
            </a>


            <a
                class="tool"
                href="https://free.drweb.com/download+cureit+free/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="tool-text">
                    <div class="tool-name">Dr.Web CureIt!</div>

                    <div class="tool-description">
                        Бесплатная утилита для проверки компьютера на вредоносное ПО
                    </div>
                </div>

                <div class="arrow">→</div>
            </a>


            <a
                class="tool"
                href="https://www.virustotal.com/gui/home/upload"
                target="_blank"
                rel="noopener noreferrer"
            >
                <div class="tool-text">
                    <div class="tool-name">VirusTotal</div>

                    <div class="tool-description">
                        Проверка файла несколькими антивирусными движками
                    </div>
                </div>

                <div class="arrow">→</div>
            </a>

        </div>

    </main>

</body>
</html>
